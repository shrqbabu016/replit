name: Replit Auto Start

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  floppy_run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Test Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Note: Node 20 is the current LTS, 24 isn't officially out/stable on runners yet.

      - name: "Install Replit Dependencies"
        run: |
          npm install

      - name: "Run Browser Open Replit"
        run: |
          node scripts.js
